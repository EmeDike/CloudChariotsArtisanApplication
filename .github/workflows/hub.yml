name: Deploy-hub
on:
  push:
    branches:
      - hub
jobs:
  deploy:
    name: deploy  # Customize your job name if needed
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
        python-version:
          - 3.9
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Cache node modules
        uses: actions/cache@v3
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      # Install Python dependencies
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      # Install Node.js dependencies
      - name: Install Node Dependencies
        run: |
          npm install serverless -g
          npm install
      # Deploy using Serverless
      - name: Serverless with Python Requirements
        uses: dhollerbach/actions.serverless-with-python-requirements@master
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.CLOUDCHARIOTS }}
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESSKEY1 }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRETKEY1 }}
          STAGE: qa  # You can set your custom stage here