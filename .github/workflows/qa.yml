name: Deploy-QA
on:
  push:
    branches:
      - qa
jobs:
  deploy:
    name: deploy  #${{ secrets.ENVIRONMENT }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
        python-version:
          - 3.9
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Cache node modules
        uses: actions/cache@v3
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      # --------- use Python to install Python dependencies and run linter, tests, etc. ---------
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
#          python3.9 -m pip install --upgrade pip
#          python3.9 -m pip install \
#                        --platform manylinux2014_x86_64 \
#                        --target=my-lambda-function \
#                        --implementation cp \
#                        --python-version 3.9 \
#                        --only-binary=:all: --upgrade \
#                        -r requirements.txt
      - name: Install Node Dependencies
        # run: |
        #    npm install
        run: |
          npm install serverless -g
          npm install
      - name: Serverless with Python Requirements
        uses: dhollerbach/actions.serverless-with-python-requirements@master
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.CLOUDCHARIOTS }}
          # or if using AWS credentials directly
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCESSKEY1 }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRETKEY1 }}
          # STAGE: dev