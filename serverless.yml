service: "Artisan-application-python-http-api"
frameworkVersion: '3'
provider:
  name: aws
  runtime: python3.9
  region: ${self:custom.${self:provider.stage}.region}
  stage: ${opt:stage, self:custom.defaultEnv}
  timeout: 15
  memorySize: 128
  environment:
    COGNITO_USER_POOL_ID: eu-west-2_aAiz68RUa
    COGNITO_CLIENT_ID: fsevtbl0am0q2gr5enlg0pbno

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ssm:GetParameters
          Resource: "arn:aws:ssm:eu-west-2:628479575487:parameter/DB_*"
functions:
  user_login:
    handler: handler.user_login
    events:
      - httpApi:
          path: /user_login
          method: post

  registerArtisan:
    handler: handler.registerArtisan
    events:
      - httpApi:
          path: /registerArtisan
          method: post

  registerCustomer:
    handler: handler.registerCustomer
    events:
      - httpApi:
          path: /registerCustomer
          method: post

  registerAdmin:
    handler: handler.registerAdmin
    events:
      - httpApi:
          path: /registerAdmin
          method: post

plugins:
  - serverless-python-requirements
  - serverless-offline
  - serverless-prune-plugin
custom:
  prune:
    automatic: true
    number: 3
  defaultEnv: qa
  hub:
    region: eu-west-2
  dev:
    region: eu-west-2
    profile: dev
  qa:
    region: eu-west-2
    profile: qa
  prod:
    region: eu-west-2
    profile: prod
  pythonRequirements:
    dockerizePip: non-linux