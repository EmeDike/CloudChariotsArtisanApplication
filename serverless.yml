service: "Artisan-application-python-http-api"
frameworkVersion: '3'
provider:
  name: aws
  runtime: python3.11
  region: ${self:custom.${self:provider.stage}.region}
  stage: ${opt:stage, self:custom.defaultEnv}
  timeout: 15
  memorySize: 128
  environment:
    COGNITO_USER_POOL_ID: eu-west-2_aAiz68RUa
    COGNITO_CLIENT_ID: fsevtbl0am0q2gr5enlg0pbno
  httpApi:
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.eu-west-2.amazonaws.com/eu-west-2_aAiz68RUa
        audience:
          - fsevtbl0am0q2gr5enlg0pbno
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - ssm:GetParameters
          Resource: "arn:aws:ssm:eu-west-2:628479575487:parameter/DB_*"
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:AdminInitiateAuth
          Resource: "arn:aws:cognito-idp:eu-west-2:628479575487:userpool/eu-west-2_aAiz68RUa"

functions:
  # === PUBLIC (no authorizer) ===
  user_login:
    handler: handler.user_login
    events:
      - httpApi:
          path: /user_login
          method: post

  registerArtisan:
    handler: handler.registerArtisan
    events:
      - httpApi:
          path: /registerArtisan
          method: post

  registerCustomer:
    handler: handler.registerCustomer
    events:
      - httpApi:
          path: /registerCustomer
          method: post

  registerAdmin:
    handler: handler.registerAdmin
    events:
      - httpApi:
          path: /registerAdmin
          method: post

  sendOtp:
    handler: handler.sendOtp
    events:
      - httpApi:
          path: /sendOtp
          method: post

  verifyOtp:
    handler: handler.verifyOtp
    events:
      - httpApi:
          path: /verifyOtp
          method: post

  getArtiAvail:
    handler: handler.getArtiAvail
    events:
      - httpApi:
          path: /getArtiAvail
          method: get
          authorizer:
            name: cognitoAuthorizer

  searchNearbyArtisans:
    handler: handler.searchNearbyArtisans
    events:
      - httpApi:
          path: /searchNearbyArtisans
          method: post
          authorizer:
            name: cognitoAuthorizer

  createJobRequest:
    handler: handler.createJobRequest
    events:
      - httpApi:
          path: /createJobRequest
          method: post
          authorizer:
            name: cognitoAuthorizer

  updateJobRequestStatus:
    handler: handler.updateJobRequestStatus
    events:
      - httpApi:
          path: /updateJobRequestStatus
          method: post
          authorizer:
            name: cognitoAuthorizer

  createBooking:
    handler: handler.createBooking
    events:
      - httpApi:
          path: /createBooking
          method: post
          authorizer:
            name: cognitoAuthorizer

  getCustomerBookings:
    handler: handler.getCustomerBookings
    events:
      - httpApi:
          path: /getCustomerBookings
          method: get
          authorizer:
            name: cognitoAuthorizer

  createReview:
    handler: handler.createReview
    events:
      - httpApi:
          path: /createReview
          method: post
          authorizer:
            name: cognitoAuthorizer

  getDashboard:
    handler: handler.getDashboard
    events:
      - httpApi:
          path: /artisan/dashboard
          method: GET
          authorizer:
            name: cognitoAuthorizer


  toggleAvailability:
    handler: handler.toggleAvailability
    events:
      - httpApi:
          path: /artisan/toggle-availability
          method: PUT
          authorizer:
            name: cognitoAuthorizer

  getEarnings:
    handler: handler.getEarnings
    events:
      - httpApi:
          path: /artisan/earnings
          method: GET
          authorizer:
            name: cognitoAuthorizer

  getJobs:
    handler: handler.getJobs
    events:
      - httpApi:
          path: /artisan/jobs
          method: GET
          authorizer:
            name: cognitoAuthorizer

  getJobRequests:
    handler: handler.getJobRequests
    events:
      - httpApi:
          path: /artisan/job-requests
          method: GET
          authorizer:
            name: cognitoAuthorizer

  respondToJobRequest:
    handler: handler.respondToJobRequest
    events:
      - httpApi:
          path: /artisan/job-requests/{jobRequestId}/respond
          method: PUT
          authorizer:
            name: cognitoAuthorizer

  getReviews:
    handler: handler.getReviews
    events:
      - httpApi:
          path: /artisan/reviews
          method: GET
          authorizer:
            name: cognitoAuthorizer

  getNotifications:
    handler: handler.getNotifications
    events:
      - httpApi:
          path: /artisan/notifications
          method: GET
          authorizer:
            name: cognitoAuthorizer

  markNotificationsRead:
    handler: handler.markNotificationsRead
    events:
      - httpApi:
          path: /artisan/notifications/mark-read
          method: PUT
          authorizer:
            name: cognitoAuthorizer

  getProfile:
    handler: handler.getProfile
    events:
      - httpApi:
          path: /artisan/profile
          method: GET
          authorizer:
            name: cognitoAuthorizer

  updateProfile:
    handler: handler.updateProfile
    events:
      - httpApi:
          path: /artisan/profile
          method: PUT
          authorizer:
            name: cognitoAuthorizer

  getWallet:
    handler: handler.getWallet
    events:
      - httpApi:
          path: /artisan/wallet
          method: GET
          authorizer:
            name: cognitoAuthorizer

  requestWithdrawal:
    handler: handler.requestWithdrawal
    events:
      - httpApi:
          path: /artisan/wallet/withdraw
          method: POST
          authorizer:
            name: cognitoAuthorizer

  getSupportTickets:
    handler: handler.getSupportTickets
    events:
      - httpApi:
          path: /artisan/support-tickets
          method: GET
          authorizer:
            name: cognitoAuthorizer

  createSupportTicket:
    handler: handler.createSupportTicket
    events:
      - httpApi:
          path: /artisan/support-tickets
          method: POST
          authorizer:
            name: cognitoAuthorizer

  getTicketMessages:
    handler: handler.getTicketMessages
    events:
      - httpApi:
          path: /artisan/support-tickets/{ticketId}/messages
          method: GET
          authorizer:
            name: cognitoAuthorizer

  sendTicketMessage:
    handler: handler.sendTicketMessage
    events:
      - httpApi:
          path: /artisan/support-tickets/{ticketId}/messages
          method: POST
          authorizer:
            name: cognitoAuthorizer

plugins:
  - serverless-python-requirements

custom:
  defaultEnv: qa
  hub:
    region: eu-west-2
  dev:
    region: eu-west-2
    profile: dev
  qa:
    region: eu-west-2
    profile: qa
  prod:
    region: eu-west-2
    profile: prod
  pythonRequirements:
    dockerizePip: non-linux